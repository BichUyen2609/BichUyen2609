    <rect width="1200" height="44" fill="#091326"/>
    <path d="M14 21H288M912 21H1186" stroke="url(#rule)"/>
       <text x="310" y="29" font-size="21" font-weight="700" fill="#59beff">&lt;/&gt;</text>
