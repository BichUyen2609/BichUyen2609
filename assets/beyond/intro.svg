<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="44" viewBox="0 0 1200 44" role="img" aria-labelledby="title">
  <title id="title">Mình là Uyên · Sinh viên CNTT</title>
  <defs>
    <linearGradient id="panel" x2=".92" y2="1">
      <stop stop-color="#101e3b"/>
